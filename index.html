<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf-Bytes | Arcade Cabinet</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0c10;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .arcade-cabinet {
            width: 450px;
            background: #111;
            border: 12px solid #2a2a35;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Side bevels */
        .arcade-cabinet::before, .arcade-cabinet::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background: linear-gradient(to right, rgba(255,255,255,0.05), transparent);
            pointer-events: none;
        }
        .arcade-cabinet::before { left: -12px; }
        .arcade-cabinet::after { right: -12px; transform: scaleX(-1); }

        .marquee-container {
            background: linear-gradient(to bottom, #1a1a24, #000);
            padding: 10px;
            border-bottom: 5px solid #000;
        }

        .marquee {
            background: #fff;
            padding: 20px;
            text-align: center;
            border: 4px solid #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .marquee h1 {
            color: #ff003c;
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            font-size: 26px;
            text-shadow: 2px 2px 0px #88001b, -1px -1px 0px #ffb3c6;
            letter-spacing: -1px;
        }

        .screen-bezel {
            background: #1a1a1a;
            padding: 15px;
            border-top: 2px solid #333;
        }

        .screen {
            background: #030303;
            padding: 25px 20px;
            border-radius: 8px;
            border: 2px solid #222;
            box-shadow: inset 0 0 30px #000, 0 0 10px rgba(0, 255, 65, 0.05);
            min-height: 550px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
            padding: 12px 15px;
            background: #0a0a0a;
            transition: 0.2s;
        }

        .game-row:hover {
            border-color: #444;
            background: #151515;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon {
            font-size: 16px;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
        }

        .game-title {
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            text-shadow: 1px 1px 0 #000;
            line-height: 1.4;
        }

        .play-btn {
            background: #ff003c;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            padding: 8px 12px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3), inset 2px 2px 0px rgba(255,255,255,0.3);
            transition: 0.1s;
        }

        .play-btn:active {
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.5);
            transform: translateY(2px);
        }

        .coin-panel {
            background: linear-gradient(to bottom, #4a4a55, #1a1a24);
            height: 70px;
            border-top: 8px solid #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
        }

        .coin-slot {
            width: 20px;
            height: 35px;
            background: #000;
            border: 2px solid #222;
            border-top-color: #111;
            border-bottom-color: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .coin-glow {
            width: 3px;
            height: 16px;
            background: #ff0000;
            box-shadow: 0 0 6px #ff0000;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        
        <div class="marquee-container">
            <div class="marquee">
                <h1>WOLF-BYTES</h1>
            </div>
        </div>

        <div class="screen-bezel">
            <div class="screen">
                
                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">SPACED INVADERS</span>
                    </div>
                    <a href="https://sam420aibob-del.github.io/spaced-invaders/" class="play-btn">1 PLAYER</a>
                </div>

                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">NEON BREAKER</span>
                    </div>
                    <a href="#" class="play-btn">1 PLAYER</a>
                </div>

                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">CYBER SCROLLER</span>
                    </div>
                    <a href="#" class="play-btn">1 PLAYER</a>
                </div>

                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">CYBEROIDS</span>
                    </div>
                    <a href="#" class="play-btn">1 PLAYER</a>
                </div>

                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">BLOCK DROP</span>
                    </div>
                    <a href="#" class="play-btn">1 PLAYER</a>
                </div>

                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">RETRO PONG</span>
                    </div>
                    <a href="#" class="play-btn">1 PLAYER</a>
                </div>

                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">CYBER SNAKE</span>
                    </div>
                    <a href="#" class="play-btn">1 PLAYER</a>
                </div>

                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">FLAPPY SHIP</span>
                    </div>
                    <a href="#" class="play-btn">1 PLAYER</a>
                </div>

                <div class="game-row">
                    <div class="game-info">
                        <span class="game-icon">??</span>
                        <span class="game-title">NEON MAZE</span>
                    </div>
                    <a href="#" class="play-btn">1 PLAYER</a>
                </div>

            </div>
        </div>

        <div class="coin-panel">
            <div class="coin-slot"><div class="coin-glow"></div></div>
            <div class="coin-slot"><div class="coin-glow"></div></div>
        </div>

    </div>

</body>
</html>
